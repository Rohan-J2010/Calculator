<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131b; }
		.calculator { width: min(92vw, 360px); padding: 20px; border-radius: 24px; background: #1c2130; box-shadow: 0 20px 50px #0008; }
		.screen { min-height: 100px; padding: 18px 14px; margin-bottom: 16px; border-radius: 14px; background: #0d1017; text-align: right; overflow: hidden; }
		#expression { min-height: 24px; color: #8e98ae; font-size: 1rem; white-space: nowrap; }
		#display { margin-top: 8px; color: #fff; font-size: 2.5rem; font-weight: 650; white-space: nowrap; overflow-x: auto; }
		.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		button { border: 0; min-height: 58px; border-radius: 14px; color: #f8f9ff; background: #2a3143; font-size: 1.2rem; cursor: pointer; transition: filter .15s, transform .1s; }
		button:hover { filter: brightness(1.2); } button:active { transform: scale(.96); }
		.operator { background: #37486d; color: #bcd0ff; } .action { background: #493449; color: #ffb6c9; }
		.equals { background: #5d75d6; } .wide { grid-column: span 2; }
	</style>
</head>
<body>
	<main class="calculator" aria-label="Calculator">
		<section class="screen" aria-live="polite">
			<div id="expression"></div><div id="display">0</div>
		</section>
		<div class="keys">
			<button class="action" data-action="clear">AC</button><button class="action" data-action="backspace">⌫</button>
			<button class="operator" data-value="%">%</button><button class="operator" data-value="/">÷</button>
			<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
			<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
			<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
			<button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button>
		</div>
	</main>
	<script>
		const display = document.querySelector('#display'), expression = document.querySelector('#expression');
		let input = '', justCalculated = false;
		const operators = '+-*/%';
		function render() { display.textContent = input || '0'; }
		function append(value) {
			if (justCalculated && !operators.includes(value)) input = '';
			justCalculated = false;
			if (value === '.') {
				const part = input.split(/[+\-*/%]/).pop(); if (part.includes('.')) return;
				if (!part) input += '0';
			}
			if (operators.includes(value)) {
				if (!input && value !== '-') return;
				if (operators.includes(input.slice(-1))) input = input.slice(0, -1);
			}
			input += value; render();
		}
		async function calculate() {
			if (!input || operators.includes(input.slice(-1))) return;
			expression.textContent = input.replaceAll('*','×').replaceAll('/','÷');
			try {
				// Flask/FastAPI-compatible endpoint. Use local evaluation if no backend is running.
				let result;
				try { const response = await fetch('/calculate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ expression: input }) });
					if (!response.ok) throw Error(); const data = await response.json(); result = data.result;
				} catch (_) {
					if (!/^[0-9+\-*/%.() ]+$/.test(input)) throw Error();
					result = Function('"use strict"; return (' + input + ')')();
				}
				if (!Number.isFinite(Number(result))) throw Error(); input = String(result); justCalculated = true; render();
			} catch (_) { display.textContent = 'Error'; input = ''; }
		}
		document.querySelector('.keys').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.action === 'clear') { input = ''; expression.textContent = ''; render(); } else if (b.dataset.action === 'backspace') { input = input.slice(0,-1); render(); } else if (b.dataset.action === 'equals') calculate(); else append(b.dataset.value); });
		document.addEventListener('keydown', e => { if (/^[0-9.]$/.test(e.key)) append(e.key); else if (operators.includes(e.key)) append(e.key); else if (e.key === 'Enter' || e.key === '=') calculate(); else if (e.key === 'Backspace') { input = input.slice(0,-1); render(); } else if (e.key === 'Escape') { input=''; expression.textContent=''; render(); } });
	</script>
</body>
</html>
